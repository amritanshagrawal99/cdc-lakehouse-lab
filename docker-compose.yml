# Postgres (logical replication) -> Debezium on Kafka Connect -> Kafka (KRaft, single node).
# Credentials are local-lab values only. Heaps are capped so the stack fits in ~3 GB.
name: cdclab
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    # max_slot_wal_keep_size: a stopped connector cannot fill the disk; past 1 GB the slot is invalidated (re-snapshot).
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4",
              "-c", "max_slot_wal_keep_size=1GB"]
    ports: ["55432:5432"]   # host 55432: leaves 5432 free for other local Postgres
    healthcheck:
      # TCP check: the init-time temporary server listens on the socket only, so this passes once the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lab -d lab && [ \"$$(psql -U lab -d lab -tAc 'show wal_level')\" = logical ]"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
      start_interval: 1s

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 20s
      retries: 30
      start_period: 90s
      start_interval: 2s

  connect:
    # The tag is rebuilt daily on quay.io; the digest verified on 2026-10-24 was
    # sha256:92b882d4d746c64469e971354bb9c6152de560e781df6511b3c550ad41db4543 (pin it for bit-for-bit CI).
    image: quay.io/debezium/connect:3.7.0.Final
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: lab-connect
      CONFIG_STORAGE_TOPIC: lab_connect_configs
      OFFSET_STORAGE_TOPIC: lab_connect_offsets
      STATUS_STORAGE_TOPIC: lab_connect_statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_FLUSH_INTERVAL_MS: "5000"   # a Connect crash replays at most ~5 s of events (Debezium is at-least-once)
      CONNECT_PLUGIN_DISCOVERY: service_load   # ~37 s instead of ~100 s to start, half the memory
      HEAP_OPTS: "-Xms256m -Xmx768m"
    ports: ["18083:8083"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/health > /dev/null"]   # KIP-1017: ready, not just listening
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 90s
      start_interval: 2s
