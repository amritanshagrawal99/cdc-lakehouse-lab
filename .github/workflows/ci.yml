name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  e2e:
    # The real pipeline: Postgres -> Debezium -> Kafka -> Iceberg, including consumer and Kafka Connect crashes.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 300
      - name: End-to-end tests
        env:
          CDCLAB_E2E: "1"
        run: pytest -q -s tests/test_e2e.py
      - name: Logs
        if: always()
        run: docker compose logs --no-color --tail 300
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
